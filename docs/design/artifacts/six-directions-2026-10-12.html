        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    &lt;/section&gt;

      &lt;div class=&quot;product stage&quot; data-kind=&quot;chat-bookmark&quot;&gt;&lt;header class=&quot;bar&quot;&gt;&lt;strong&gt;Jim · Session 18&lt;/strong&gt;&lt;small&gt;Conversation beside Notes&lt;/small&gt;&lt;/header&gt;&lt;main class=&quot;workspace&quot;&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;Interactive sketch · synthetic session · no model connection&lt;/span&gt;&lt;span&gt;Enter sends · Shift Enter adds a line&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;
    &lt;/section&gt;

      &lt;div class=&quot;product stage&quot; data-kind=&quot;chat-first&quot;&gt;&lt;header class=&quot;bar&quot;&gt;&lt;strong&gt;Jim · Session 18&lt;/strong&gt;&lt;small&gt;Continue your programming conversation&lt;/small&gt;&lt;/header&gt;&lt;main class=&quot;workspace&quot;&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;Interactive sketch · synthetic session · no model connection&lt;/span&gt;&lt;span&gt;Exercise actions appear only when selected&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;
    &lt;/section&gt;

      &lt;div class=&quot;product stage&quot; data-kind=&quot;tray-strip&quot;&gt;&lt;header class=&quot;bar&quot;&gt;&lt;strong&gt;Jim · Session 18&lt;/strong&gt;&lt;small&gt;Conversation + decisions in progress&lt;/small&gt;&lt;/header&gt;&lt;main class=&quot;workspace&quot;&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;Interactive sketch · synthetic session · local changes only&lt;/span&gt;&lt;span&gt;Collecting an idea never changes Notes&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;

      &lt;div class=&quot;product stage&quot; data-kind=&quot;tray-review&quot;&gt;&lt;header class=&quot;bar&quot;&gt;&lt;strong&gt;Jim · Pick up Session 18&lt;/strong&gt;&lt;small&gt;A small review, not a task board&lt;/small&gt;&lt;/header&gt;&lt;main class=&quot;workspace&quot;&gt;&lt;/main&gt;&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;Interactive sketch · synthetic session · local changes only&lt;/span&gt;&lt;span&gt;Review one change at a time&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;
    &lt;/section&gt;

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;ga-six-directions&#x27;);
    const clean = &#x27;B2 Power-clean progression\nSet 1: Tall muscle clean\nSet 2: Muscle clean from power position\nSet 3: Power clean from power position\nControlled reps; reset between reps.&#x27;;
    const basics = &#x27;A1 Push press — build to a technically heavy 3\n\nA2 Step-to-split — 3/side\nBar on upper back; precise split position.\n\nB1 Front squat to target\nTarget just above parallel; controlled reps.&#x27;;
    const initialNote = basics + &#x27;\n\nB2 — still choosing clean progression\n\nConditioning — not planned yet&#x27;;
    const initialDraft = basics + &#x27;\n\n&#x27; + clean;
    const saved = window.openai?.widgetState?.privateContent;
    let revision=saved?.revision||0;
    const kinds = [&#x27;scratch-copy&#x27;,&#x27;scratch-margin&#x27;,&#x27;chat-bookmark&#x27;,&#x27;chat-first&#x27;,&#x27;tray-strip&#x27;,&#x27;tray-review&#x27;];
    const state = Object.fromEntries(kinds.map(k=&gt;[k,{note:initialNote,draft:initialDraft,accepted:false,applied:false,comments:[],input:&#x27;&#x27;,...((saved?.schema===1&amp;&amp;saved.states?.[k])||{})}]));
    const escape = s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const choices = { resumed:true, reasons:true };
    const button = (label,action,cls=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction ${cls}&quot; data-action=&quot;${action}&quot;&gt;${label}&lt;/button&gt;`;
    function persist() {
      const summary=kinds.filter(k=&gt;state[k].accepted||state[k].comments.length||state[k].applied).map(k=&gt;({variant:k,cleanAccepted:state[k].accepted,appliedInMock:state[k].applied,refinements:state[k].comments.slice(-2).map(c=&gt;c.slice(0,100))}));
      const bounded=Object.fromEntries(kinds.map(k=&gt;[k,{...state[k],comments:state[k].comments.slice(-2).map(c=&gt;c.slice(0,120)),input:state[k].input.slice(0,120)}]));
      revision+=1;
      if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{scenario:&#x27;synthetic half-planned Session 18&#x27;,interactions:summary},privateContent:{schema:1,revision,states:bounded}}).catch(()=&gt;{});
    }
    function resume() {
      return `&lt;div class=&quot;resume&quot; data-resume${choices.resumed?&#x27;&#x27;:&#x27; hidden&#x27;}&gt;&lt;div class=&quot;eyebrow&quot;&gt;Where we left off&lt;/div&gt;&lt;p&gt;Push press → rear-rack split practice is settled. Front squat has its own station—not a clean complex.&lt;/p&gt;&lt;p class=&quot;unfinished&quot; data-open-status&gt;Still open: the clean progression, then conditioning.&lt;/p&gt;&lt;div data-reasons${choices.reasons?&#x27;&#x27;:&#x27; hidden&#x27;}&gt;&lt;span class=&quot;subtle&quot;&gt;Keep: two racks · no additional overhead catch after the heavy press · dip-and-drive carries into clean practice.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    function notes(k,bookmark=false) {
      return `&lt;aside class=&quot;notes ${bookmark?&#x27;program-bookmark&#x27;:&#x27;&#x27;}&quot; aria-label=&quot;Program recorded in Notes&quot;&gt;&lt;div class=&quot;note-label&quot;&gt;Notes &lt;span class=&quot;subtle&quot;&gt;· recorded program&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Session 18&lt;/h2&gt;&lt;p class=&quot;subtle&quot;&gt;Strength work for a small group&lt;/p&gt;&lt;div class=&quot;note-content&quot; data-note&gt;${escape(state[k].note)}&lt;/div&gt;&lt;div class=&quot;rule&quot;&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Context we were using&lt;/summary&gt;&lt;p&gt;Two racks. One athlete needs precise lunge-position practice. Keep the split drill rear-rack rather than adding another overhead catch.&lt;/p&gt;&lt;/details&gt;&lt;/aside&gt;`;
    }
    function composer(k,placeholder=&#x27;Continue in your own words…&#x27;) {
      return `&lt;div class=&quot;composer&quot; data-composer&gt;&lt;textarea aria-label=&quot;Free-form program refinement&quot; placeholder=&quot;${placeholder}&quot; rows=&quot;2&quot; maxlength=&quot;200&quot;&gt;${escape(state[k].input)}&lt;/textarea&gt;&lt;button type=&quot;button&quot; class=&quot;primary cursor-interaction&quot; aria-label=&quot;Send refinement&quot;&gt;Send&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;subtle&quot;&gt;Try: “Keep the first two clean sets light; fewer options for the finisher.”&lt;/div&gt;`;
    }
    function history(k) {
      return `&lt;div class=&quot;conversation-log&quot; aria-live=&quot;polite&quot;&gt;${state[k].comments.map(c=&gt;`&lt;div class=&quot;question&quot;&gt;${escape(c)}&lt;/div&gt;&lt;p class=&quot;subtle&quot;&gt;Saved with this session. This sketch does not generate an assistant reply.&lt;/p&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    }
    function mention(label,key) {
      return `&lt;button type=&quot;button&quot; class=&quot;mention cursor-interaction&quot; data-mention=&quot;${key}&quot; aria-label=&quot;Actions for ${label}&quot;&gt;${label}&lt;/button&gt;`;
    }
    function chat(k) {
      return `&lt;div class=&quot;question&quot;&gt;Keep the split drill rear-rack. What should the clean progression look like?&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;p&gt;Start with the catch and add speed gradually:&lt;/p&gt;&lt;p&gt;Set 1 · ${mention(&#x27;Tall muscle clean&#x27;,&#x27;tall&#x27;)}&lt;br&gt;Set 2 · ${mention(&#x27;Muscle clean from power position&#x27;,&#x27;muscle&#x27;)}&lt;br&gt;Set 3 · ${mention(&#x27;Power clean from power position&#x27;,&#x27;power&#x27;)}&lt;/p&gt;&lt;p data-reasons${choices.reasons?&#x27;&#x27;:&#x27; hidden&#x27;}&gt;This keeps the receiving practice separate from the squat station, and reuses the vertical drive you prepared.&lt;/p&gt;&lt;/div&gt;&lt;div data-mention-host&gt;&lt;/div&gt;&lt;div data-proposal-host&gt;&lt;/div&gt;${history(k)}${composer(k)}`;
    }
    function editor(k) {
      return `&lt;label&gt;&lt;span class=&quot;eyebrow&quot;&gt;Working text · strength block only&lt;/span&gt;&lt;textarea class=&quot;draft&quot; data-draft aria-label=&quot;Editable working strength block&quot; maxlength=&quot;900&quot;&gt;${escape(state[k].draft)}&lt;/textarea&gt;&lt;/label&gt;`;
    }
    function draftActions() {
      return `&lt;div class=&quot;actions&quot;&gt;${button(&#x27;Review change&#x27;,&#x27;review-draft&#x27;,&#x27;primary&#x27;)}${button(&#x27;Compare with Notes&#x27;,&#x27;compare&#x27;,&#x27;quiet&#x27;)}&lt;/div&gt;&lt;div data-compare hidden&gt;&lt;/div&gt;&lt;div data-proposal-host&gt;&lt;/div&gt;`;
    }
    function strips(k) {
      const status=state[k].applied?&#x27;In Notes&#x27;:state[k].accepted?&#x27;Chosen · not in Notes&#x27;:&#x27;Proposed · not chosen&#x27;;
      return `&lt;div class=&quot;decision-strip&quot;&gt;&lt;h3&gt;Ideas you haven&#x27;t finished with&lt;/h3&gt;&lt;div class=&quot;strip-items&quot;&gt;&lt;article&gt;&lt;p&gt;Clean progression &lt;span class=&quot;subtle&quot; data-clean-status&gt;· ${status}&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;subtle&quot;&gt;Tall muscle → muscle from power → power clean from power&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${button(&#x27;Review&#x27;,&#x27;review-clean&#x27;)}${button(state[k].accepted?&#x27;Chosen&#x27;:&#x27;Choose this&#x27;,&#x27;accept&#x27;,&#x27;quiet&#x27;)}&lt;/div&gt;&lt;/article&gt;&lt;article&gt;&lt;p&gt;Conditioning &lt;span class=&quot;subtle&quot;&gt;· still open&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;subtle&quot;&gt;Not enough decided to propose a change yet.&lt;/p&gt;${button(&#x27;Discuss the finisher&#x27;,&#x27;finisher&#x27;,&#x27;quiet&#x27;)}&lt;/article&gt;&lt;/div&gt;&lt;div data-proposal-host&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    function render(k) {
      const app=root.querySelector(`[data-kind=&quot;${k}&quot;]`);
      let html=&#x27;&#x27;;
      if(k===&#x27;scratch-copy&#x27;) html=`&lt;div class=&quot;split&quot;&gt;${notes(k)}&lt;section aria-label=&quot;Working copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Jim · this block, not the whole note&lt;/div&gt;${resume()}${editor(k)}${draftActions()}${history(k)}${composer(k,&#x27;Refine this block in plain language…&#x27;)}&lt;/section&gt;&lt;/div&gt;`;
      if(k===&#x27;scratch-margin&#x27;) html=`${resume()}&lt;div class=&quot;margin-sheet&quot;&gt;&lt;section class=&quot;inline-work&quot; aria-label=&quot;Working block&quot;&gt;&lt;h2&gt;Session 18 · strength&lt;/h2&gt;&lt;p class=&quot;subtle&quot;&gt;A temporary copy from Notes. Only this block will be reviewed.&lt;/p&gt;${editor(k)}${draftActions()}&lt;details&gt;&lt;summary&gt;Original in Notes&lt;/summary&gt;&lt;div class=&quot;note-content&quot; data-note&gt;${escape(state[k].note)}&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;aside aria-label=&quot;Margin conversation&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Beside the draft&lt;/div&gt;&lt;div class=&quot;question&quot;&gt;Paired stations, not a complex.&lt;/div&gt;&lt;p&gt;Right. The front squat stays B1; the clean progression goes in B2.&lt;/p&gt;&lt;p data-reasons${choices.reasons?&#x27;&#x27;:&#x27; hidden&#x27;}&gt;Rear-rack split practice avoids another overhead catch while keeping the precise footwork challenge.&lt;/p&gt;${history(k)}${composer(k,&#x27;What would you change here?&#x27;)}&lt;/aside&gt;&lt;/div&gt;`;
      if(k===&#x27;chat-bookmark&#x27;) html=`&lt;div class=&quot;split&quot;&gt;${notes(k)}&lt;section aria-label=&quot;Programming conversation&quot;&gt;${resume()}${chat(k)}&lt;/section&gt;&lt;/div&gt;`;
